name: Check for concerts

on:
  schedule:
    # Every hour, so new Ticketmaster/Bandsintown listings get caught fast.
    # Alerts only fire on genuinely new shows, so this stays silent (no
    # extra noise) - it just shortens the delay before you hear about one.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Check for new shows
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          BANDSINTOWN_APP_ID: ${{ secrets.BANDSINTOWN_APP_ID }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: npm run check

      - name: Commit updated event state
        run: |
          git config user.name "bands-alert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seen-events.json
          git diff --staged --quiet || git commit -m "chore: update seen events state"
          git push
